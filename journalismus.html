    <style>
      .bg-texture::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('graphics/noise.svg');
        opacity: 0.15;
        pointer-events: none;
        z-index: 50;
        mix-blend-mode: multiply;
      }
      .bg-crumpled {
        position: relative;
        background-color: #E6D5B8; 
      }
      .bg-crumpled::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('graphics/crumpled.jpg');
        background-size: cover;
        background-position: center;
        opacity: 1;
        z-index: 0; 
      }
      ::selection {
        background: #b91c1c;
        color: #F0E6D2;
      }
      /* Utility class for the unified card style */
      .card-box {
        background-color: #f6faf9; /* UPDATED COLOR */
        border: 1px solid #1c1917; /* ink */
        padding: 1.5rem;
        position: relative;
        box-shadow: 4px 4px 0px 0px rgba(28,25,23,1);
        transition: transform 0.2s;
      }
      .card-box:hover {
        transform: translateY(-2px);
      }
      .card-tag {
        position: absolute;
        top: -0.75rem;
        left: 1rem;
        background-color: #1c1917;
        color: #F0E6D2;
        font-size: 0.625rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.25rem 0.5rem;
      }
      .card-tag.highlight {
        background-color: #b91c1c;
        color: #F0E6D2;
      }
    </style>
</head>
